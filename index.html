<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mentor Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400..800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Mentor Desk · personal workspace
   Ground: warm graphite. Signal: ember orange (actions). Growth: lime (done, streaks, coverage).
   Type: Instrument Serif (display, italic accents), Schibsted Grotesk (UI), JetBrains Mono (data, templates). */
:root{
  --bg:#111013; --bg-2:#151418; --panel:#1A181D; --panel-2:#221F26; --line:#2A272F; --line-2:#3A3640;
  --text:#F2EFEA; --muted:#A8A1AE; --dim:#77707F;
  --accent:#FF8A3D; --accent-ink:#1E0E03; --accent-soft:rgba(255,138,61,.13);
  --lantern:#C6F36B; --ok:#C6F36B; --warn:#FFC857; --danger:#FF6B6B; --sky:#7CC4FF; --purple:#C3A2FF;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:18px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F4F3F1; --bg-2:#ECEAE7; --panel:#FFFFFF; --panel-2:#F4F2EF; --line:#E2DFDA; --line-2:#CFCBC4;
    --text:#17151A; --muted:#5A5560; --dim:#827C88; --accent:#D2601A; --accent-ink:#FFFFFF; --accent-soft:rgba(210,96,26,.1);
    --lantern:#4D7A12; --ok:#4D7A12; --warn:#9A6A00; --danger:#C23B3B; --sky:#2566B0; --purple:#6D46C9;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F3F1; --bg-2:#ECEAE7; --panel:#FFFFFF; --panel-2:#F4F2EF; --line:#E2DFDA; --line-2:#CFCBC4;
  --text:#17151A; --muted:#5A5560; --dim:#827C88; --accent:#D2601A; --accent-ink:#FFFFFF; --accent-soft:rgba(210,96,26,.1);
  --lantern:#4D7A12; --ok:#4D7A12; --warn:#9A6A00; --danger:#C23B3B; --sky:#2566B0; --purple:#6D46C9;
  color-scheme:light;
}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
::selection{background:var(--accent);color:var(--accent-ink)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.side{position:relative;padding:26px 16px 18px;display:flex;flex-direction:column;gap:2px;background:var(--bg-2);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 30px}
.brand .mark{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-size:26px;line-height:1;padding-bottom:2px}
.brand .word{font-family:var(--serif);font-size:25px;line-height:1;letter-spacing:-0.01em}
.brand .word em{color:var(--accent)}
.brand small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--dim);font-weight:500;margin-top:5px;letter-spacing:.02em}
.side-label{font-size:11.5px;font-weight:600;color:var(--dim);padding:0 12px 8px;letter-spacing:.04em}
.tab{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:500;text-align:left;min-height:44px;transition:background .15s ease,color .15s ease}
.tab svg{width:18px;height:18px;flex-shrink:0}
.tab:hover{background:var(--panel);color:var(--text)}
.tab.on{background:var(--panel);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.tab.on:before{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.tab.on svg{color:var(--accent)}
.tab .count{margin-left:auto;font-size:11.5px;color:var(--dim);font-family:var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.tab.on .count{color:var(--text)}
.side-foot{margin-top:auto;padding:14px 12px 4px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);line-height:1.7}
.sync{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
.sync:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sync.live:before{background:var(--ok);box-shadow:0 0 0 3px var(--accent-soft)}
.main{overflow:auto;min-width:0;background:radial-gradient(1200px 500px at 85% -10%,rgba(255,138,61,.06),transparent 60%),var(--bg)}
.page{max-width:1100px;margin:0 auto;padding:48px 44px 96px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:34px}
.ph h1{margin:0;font-family:var(--serif);font-weight:400;font-size:64px;line-height:.95;letter-spacing:-0.02em}
.ph h1 em{font-style:italic;color:var(--muted)}
.ph p{margin:12px 0 0;color:var(--muted);font-size:15.5px;max-width:40em}
.hello{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--accent);margin-bottom:14px;letter-spacing:.01em}
.hello:before{content:"";width:18px;height:1.5px;background:var(--accent)}

/* ---------- controls ---------- */
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:14.5px;white-space:nowrap;transition:transform .15s ease,border-color .15s ease,background .15s ease}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel-2)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:0;background:transparent;color:var(--dim)}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn svg{width:17px;height:17px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.input,.select,.textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;min-height:44px;transition:border-color .15s ease,box-shadow .15s ease}
.input::placeholder,.textarea::placeholder{color:var(--dim)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.textarea{resize:vertical;min-height:120px;line-height:1.65}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > .field{flex:1 1 180px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;font-size:13px;font-weight:500;color:var(--muted);min-height:32px;transition:all .15s ease}
.chip:hover{color:var(--text);border-color:var(--line-2)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:44px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-family:var(--serif);font-weight:400;font-size:26px;margin-bottom:6px}
.empty .btn{margin-top:18px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.extra{color:var(--purple)}
.tag.core{color:var(--sky)}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 20px 14px}
.card-h h2{margin:0;font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-0.01em}
.card-h span{font-size:12.5px;color:var(--dim);font-family:var(--mono)}

/* ---------- today ---------- */
.today-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
.progress{height:4px;border-radius:999px;background:var(--panel-2);overflow:hidden;margin:0 20px 8px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.task{position:relative;display:grid;grid-template-columns:62px 30px minmax(0,1fr);gap:10px;align-items:start;padding:14px 20px}
.task .t-time{order:-1;font-family:var(--mono);font-size:12.5px;color:var(--dim);padding-top:3px;text-align:right}
.task .t-time:empty:before{content:"anytime";font-size:11px}
.task:before{content:"";position:absolute;left:102px;top:0;bottom:0;width:1px;background:var(--line)}
.task:first-child:before{top:22px}.task:last-child:before{bottom:calc(100% - 22px)}
.check{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--panel);display:flex;align-items:center;justify-content:center;margin:1px 0 0 0;padding:0;transition:all .2s ease}
.check:hover{border-color:var(--accent)}
.check svg{width:12px;height:12px;opacity:0;color:var(--accent-ink);transform:scale(.6);transition:all .2s cubic-bezier(.2,1.4,.4,1)}
.task.done .check{background:var(--ok);border-color:var(--ok)}
.task.done .check svg{color:var(--bg)}
.task.done .check svg{opacity:1;transform:none}
.task.done .t-title{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--line-2)}
.t-title{font-weight:600;font-size:15.5px}
.t-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--dim)}
.t-notes{margin-top:8px;font-size:13.5px;color:var(--muted);white-space:pre-wrap;border-left:2px solid var(--line);padding-left:10px}
.quick{padding:4px 8px 10px}
.qt{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;border-radius:12px;padding:10px 12px;text-align:left;font-weight:500}
.qt:hover{background:var(--panel-2)}
.qt:before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent);flex-shrink:0}
.qt span{flex-grow:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qt svg{width:15px;height:15px;color:var(--dim);flex-shrink:0;opacity:0;transition:opacity .15s ease}
.qt:hover svg{opacity:1}
.upcoming{padding:0 20px 16px}
.up{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14px;border-top:1px solid var(--line)}
.up:first-child{border-top:0}
.up span:last-child{color:var(--dim);font-family:var(--mono);font-size:12px;white-space:nowrap}

/* goals */
.goal-grid{display:grid;gap:22px;margin-bottom:22px}
.goal{padding:22px 22px 20px;position:relative;overflow:hidden}
.goal h2{font-family:var(--serif)!important;font-weight:400!important;font-size:24px!important;letter-spacing:-0.01em}
.goal-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.goal-top > span{font-family:var(--mono);font-size:12px!important;color:var(--lantern)!important}
.goal-num{font-family:var(--serif);font-size:64px;line-height:.9;letter-spacing:-0.02em}
.goal-num small{font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0;margin-left:4px}
.goal p{margin:10px 0 0;color:var(--muted);font-size:14px;max-width:32em}
.goal p b{color:var(--text)!important;font-weight:600!important}
.goal .btn{margin-top:16px}
.goal.met .goal-num{color:var(--ok)}
.goal.met:after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(198,243,107,.12),transparent 70%)}
.weeks{display:flex;gap:6px;margin-top:18px;align-items:flex-end}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);font-family:var(--mono)}
.wk i{width:100%;height:34px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);transition:background .3s ease}
.wk.hit i{background:var(--lantern);border-color:var(--lantern)}
.wk.now i{border:1.5px dashed var(--lantern)}
.wk.now.hit i{border-style:solid}
.wk.now{color:var(--lantern)}
.cov-bar{height:6px;border-radius:999px;background:var(--panel-2);overflow:hidden;margin-top:14px}
.cov-bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- templates ---------- */
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:9px;font-weight:600;font-size:13.5px;min-height:34px}
.seg button.on{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.filters{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.tpl-layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;align-items:start}
.tpl-list{display:flex;flex-direction:column;gap:2px;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
.search{position:relative;margin-bottom:6px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}
.search .input{padding-left:38px}
.kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--dim);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;font-family:var(--mono)}
.group-h{font-size:11.5px;font-weight:600;color:var(--dim);padding:16px 14px 6px;letter-spacing:.04em}
.tpl-item{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:14px;padding:11px 14px;transition:background .15s ease}
.tpl-item:hover{background:var(--panel)}
.tpl-item.on{background:var(--panel);border-color:var(--line-2)}
.tpl-item b{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px}
.tpl-item b svg{width:13px;height:13px;color:var(--lantern)}
.tpl-item small{display:block;color:var(--dim);font-size:12.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
.editor{padding:26px 28px 24px}
.editor-top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.title-input{background:transparent;border:0;font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.1;letter-spacing:-0.015em;padding:4px 0;width:100%;min-width:0}
.title-input::placeholder{color:var(--dim);font-style:italic}
.title-input:focus{outline:none}
.body-input{font-family:var(--mono);font-size:14px;line-height:1.75;min-height:280px;padding:16px 18px}
.meter{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;font-size:12px;color:var(--dim);flex-wrap:wrap;font-family:var(--mono)}
.meter .over{color:var(--warn)}
.vars{display:flex;gap:6px;flex-wrap:wrap}
.var{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:2px 8px}
.hint{font-size:13px;color:var(--dim);margin:16px 0 0}
.hint code{font-family:var(--mono);color:var(--accent)}
.saved{font-size:12px;color:var(--dim);font-family:var(--mono);display:inline-flex;align-items:center;gap:6px}
.saved:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* coverage */
.cov-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:22px}
.cov-head .goal-num{font-size:56px!important}
.cov-cat{margin-top:28px}
.cov-cat-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 4px 10px}
.cov-cat-h span:first-child{font-family:var(--serif);font-size:24px;color:var(--text);font-weight:400}
.cov-cat-h span:last-child{font-family:var(--mono);font-size:12px;color:var(--dim)}
.sit{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid var(--line)}
.sit:first-child{border-top:0}
.dotc{width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--line-2);display:flex;align-items:center;justify-content:center}
.dotc svg{width:10px;height:10px;color:var(--bg)}
.sit.ok .dotc{background:var(--ok);border:1.5px solid var(--ok)}
.sit-t{font-weight:500}
.sit-t small{display:block;font-weight:400;font-size:12.5px;color:var(--dim);margin-top:2px;font-family:var(--mono)}
.sit.ok .sit-t{color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 20px;border-top:1px solid var(--line);transition:background .15s ease}
.li:first-child{border-top:0}
.li:hover{background:color-mix(in srgb,var(--panel-2) 50%,transparent)}
.li-title{font-weight:600}
.li-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--dim)}
.li-actions{display:flex;gap:2px}
.status{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600;min-height:28px;font-family:var(--mono)}
.status.new{color:var(--sky)}
.status.planned{color:var(--lantern)}
.status.done{color:var(--ok)}
.area{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.area:before{content:"";width:6px;height:6px;border-radius:2px;background:currentColor}
.area.company{color:var(--sky)}.area.platform{color:var(--lantern)}.area.mentoring{color:var(--ok)}.area.desk{color:var(--purple)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,8,18,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.scrim.open{display:flex;animation:fadein .15s ease}
@keyframes fadein{from{opacity:0}}
.modal{width:100%;max-width:580px;max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:22px;padding:28px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}}
.modal h3{margin:0 0 6px;font-family:var(--serif);font-weight:400;font-size:32px;letter-spacing:-0.015em;line-height:1.05}
.modal .sub{margin:0 0 20px;color:var(--muted);font-size:14px}
.modal .stack{display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;flex-wrap:wrap}
.preview{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:16px;font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;line-height:1.7;max-height:240px;overflow:auto}
.preview mark{background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:0 3px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days .chip{min-width:48px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:opacity .2s ease,transform .25s cubic-bezier(.2,1.2,.4,1);pointer-events:none;z-index:60;box-shadow:0 14px 40px -10px rgba(0,0,0,.5)}

/* ---------- store ---------- */
var items={};           // id -> {kind,...}
var col=null;           // db collection when available
var assetsCap=null;     // file uploads (only in the published desk)
var LS='mentor-desk-v1';
var writeChain={};      // per-doc promise chain (one write at a time)

function loadLocal(){try{var s=localStorage.getItem(LS);if(s)items=JSON.parse(s)||{};}catch(e){items={};}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(items));}catch(e){}}

function put(id,obj){
  items[id]=obj;
  if(col){
    var p=(writeChain[id]||Promise.resolve()).then(function(){return col.doc(id).set(obj);}).catch(function(e){toast(e&&e.code==='quota_exceeded'?'Storage is full':'Could not save, try again');});
    writeChain[id]=p;
  } else saveLocal();
  render();
}
function remove(id){
  delete items[id];
  if(col){
    var p=(writeChain[id]||Promise.resolve()).then(function(){return col.doc(id).delete();}).catch(function(){toast('Could not delete, try again');});
    writeChain[id]=p;
  } else saveLocal();
  render();
}
function all(kind){return Object.keys(items).map(function(k){var o=Object.assign({},items[k]);o.id=k;return o;}).filter(function(o){return o.kind===kind;});}

async function connect(){
  if(!window.claude||!window.claude.use){intro();return;}
  try{
    var user=await window.claude.use('user');
    var db=await window.claude.use('db');
    var id=user?await user.id():null;
    if(!db||!id){intro();return;}
    col=db.collection('data/users/'+id);
    try{assetsCap=await window.claude.use('assets');}catch(e){assetsCap=null;}
    var first=true;
    col.onSnapshot(function(snap){
      var next={};
      snap.docs.forEach(function(d){next[d.id]=d.data();});
      if(first){
        first=false;
        // move anything saved locally before sync was available
        var local=items;
        Object.keys(local).forEach(function(k){if(!next[k]){next[k]=local[k];col.doc(k).set(local[k]).catch(function(){});}});
        try{localStorage.removeItem(LS);}catch(e){}
      }
      items=next;
      $('#sync').textContent='Synced to your account';
      $('#sync').classList.add('live');
      render();
      intro();
    },function(){ $('#sync').textContent='Sync paused'; $('#sync').classList.remove('live'); });
  }catch(e){}
}

function copyText(txt){

/* ---------- responsibilities logic ---------- */
function occursOn(r,d){
  if(r.repeat==='daily') return true;
  if(r.repeat==='weekly') return (r.days||[]).indexOf(d.getDay())>-1;
  if(r.repeat==='once') return r.date===dayKey(d);
  return false;
}
function scheduleLabel(r){
  if(r.repeat==='daily') return 'Every day';
  if(r.repeat==='weekly'){
    var d=(r.days||[]).slice().sort();
    if(d.join()==='1,2,3,4,5') return 'Weekdays';
    if(d.join()==='0,6') return 'Weekends';
    return d.map(function(x){return DAYS[x];}).join(', ')||'No days set';
  }
  if(r.repeat==='once'){var p=(r.date||'').split('-');if(p.length===3){var dt=new Date(+p[0],+p[1]-1,+p[2]);return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}return 'One time';}
  return '';
}
function byTime(a,b){return (a.time||'99:99').localeCompare(b.time||'99:99')||(a.title||'').localeCompare(b.title||'');}

/* ---------- RESOURCES ---------- */
var RTYPES={video:'Video',doc:'Doc',repo:'Repo',link:'Link',file:'File',note:'Note'};
var TEXT_TYPES={txt:'text/plain',md:'text/markdown',csv:'text/csv',json:'application/json',css:'text/css',js:'text/javascript'};
var FONT_TYPES={woff2:'font/woff2',woff:'font/woff',ttf:'font/ttf',otf:'font/otf'};
function detectType(url){
  var u=(url||'').toLowerCase();
  if(/youtube\.com|youtu\.be|loom\.com|vimeo\.com|wistia|\.mp4($|\?)/.test(u)) return 'video';
  if(/github\.com|gitlab\.com|codesandbox|stackblitz|codepen|replit/.test(u)) return 'repo';
  if(/docs\.google|notion\.|drive\.google|dropbox|\.pdf($|\?)|figma\.com|medium\.com|dev\.to|mdn|developer\.mozilla/.test(u)) return 'doc';
  return 'link';
}
function domainOf(url){try{return new URL(url).hostname.replace(/^www\./,'');}catch(e){return '';}}
function normUrl(u){u=(u||'').trim();if(u&&!/^[a-z]+:\/\//i.test(u))u='https://'+u;return u;}
function fmtSize(b){if(!b)return '';if(b<1024)return b+' B';if(b<1048576)return Math.round(b/1024)+' KB';return (b/1048576).toFixed(1)+' MB';}
function parseTags(v){return (v||'').split(',').map(function(t){return t.trim();}).filter(Boolean).slice(0,8);}
function fileTypeFor(f){
  var ext=(f.name.split('.').pop()||'').toLowerCase();
  if(TEXT_TYPES[ext])return TEXT_TYPES[ext];
  if(FONT_TYPES[ext])return FONT_TYPES[ext];
  if(ext==='pdf')return 'application/pdf';
  return f.type||'';
}

function resCard(r){
  var t=r.rtype||'link', isFile=t==='file', url=isFile?(r.fileId?'/_blob/'+r.fileId:''):r.url;
  var ct=r.contentType||'';
  var cover;
  if(isFile&&/^image\//.test(ct)&&r.fileId){
    cover='<a class="res-cover media t-file" href="'+esc(url)+'" target="_blank" rel="noopener"><img src="'+esc(url)+'" alt="" loading="lazy"><span class="kind">Image</span></a>';
  } else if(isFile&&/^video\//.test(ct)&&r.fileId){
    cover='<div class="res-cover media t-video"><video src="'+esc(url)+'" controls preload="metadata"></video></div>';

/* template editor autosave */
var saveT;
function bindEditor(){
  var t=$('#tpl-title'),b=$('#tpl-body'),c=$('#tpl-cat');
  if(!t) return;
  function changed(){
    var id=state.tplId;if(!id||!items[id])return;
    var len=b.value.length,lenEl=$('#tpl-len');
    lenEl.textContent=len+' / '+CHAR_LIMIT+' characters';lenEl.className=len>CHAR_LIMIT?'over':'';
    $('#tpl-vars').innerHTML=tplVars(b.value).map(function(v){return '<span class="var">{{'+esc(v)+'}}</span>';}).join('');
    $('#saved').textContent='Saving...';
    clearTimeout(saveT);
    saveT=setTimeout(function(){
      var o=Object.assign({},items[id],{title:t.value.trim(),body:b.value,category:c.value.trim(),updatedAt:Date.now()});
      items[id]=o;
      if(col){(writeChain[id]=(writeChain[id]||Promise.resolve()).then(function(){return col.doc(id).set(o);})).then(function(){var s=$('#saved');if(s)s.textContent='Saved';}).catch(function(){var s=$('#saved');if(s)s.textContent='Not saved, check connection';});}

    },600);
  }

    '<form id="rf" class="stack">'+
      '<div class="field"><label for="r-title">What is it?</label><input class="input" id="r-title" required value="'+esc(r.title||'')+'" placeholder="e.g. Post the EOD report"></div>'+
      '<div class="row"><div class="field"><label for="r-type">Type</label><select class="select" id="r-type"><option value="core"'+(r.type!=='extra'?' selected':'')+'>Core</option><option value="extra"'+(r.type==='extra'?' selected':'')+'>Extra</option></select></div>'+
      '<div class="field"><label for="r-repeat">Repeats</label><select class="select" id="r-repeat"><option value="daily"'+(r.repeat==='daily'?' selected':'')+'>Every day</option><option value="weekly"'+(r.repeat==='weekly'?' selected':'')+'>On specific days</option><option value="once"'+(r.repeat==='once'?' selected':'')+'>One time</option></select></div>'+
      '<div class="field"><label for="r-time">Time (optional)</label><input class="input" id="r-time" type="time" value="'+esc(r.time||'')+'"></div></div>'+
      '<div class="field" id="r-days-wrap"><label>Days</label><div class="days" id="r-days">'+DAYS.map(function(d,i){return '<button type="button" class="chip'+(days.indexOf(i)>-1?' on':'')+'" data-day="'+i+'" aria-pressed="'+(days.indexOf(i)>-1)+'">'+d+'</button>';}).join('')+'</div></div>'+
      '<div class="field" id="r-date-wrap"><label for="r-date">Date</label><input class="input" id="r-date" type="date" value="'+esc(r.date||dayKey())+'"></div>'+
      '<div class="field"><label for="r-notes">Notes (optional)</label><textarea class="textarea" id="r-notes" style="min-height:80px" placeholder="Links, steps, who to ping">'+esc(r.notes||'')+'</textarea></div>'+
      '<div class="modal-foot"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary" type="submit">'+(id?'Save':'Add')+'</button></div>'+
    '</form>',
  function(m){
    function vis(){var v=$('#r-repeat').value;$('#r-days-wrap').style.display=v==='weekly'?'':'none';$('#r-date-wrap').style.display=v==='once'?'':'none';}
    $('#r-repeat').onchange=vis;vis();
    $('#r-days').onclick=function(e){var b=e.target.closest('[data-day]');if(!b)return;var d=+b.dataset.day,k=days.indexOf(d);if(k>-1)days.splice(k,1);else days.push(d);b.classList.toggle('on');b.setAttribute('aria-pressed',k===-1);};
    m.querySelector('[data-close]').onclick=closeModal;
    $('#rf').onsubmit=function(e){
      e.preventDefault();
      var title=$('#r-title').value.trim();if(!title)return;
      var rep=$('#r-repeat').value;
      if(rep==='weekly'&&!days.length){toast('Pick at least one day');return;}
      var o={kind:'resp',title:title,type:$('#r-type').value,repeat:rep,days:days.sort(),date:$('#r-date').value,time:$('#r-time').value,notes:$('#r-notes').value.trim(),done:(id&&items[id].done)||{},createdAt:(id&&items[id].createdAt)||Date.now()};
      put(id||uid('r'),o);closeModal();toast(id?'Saved':'Added');Sound.play('pop');
    };
  });
}

function ideaModal(id){
  var i=items[id];if(!i)return;
  openModal('<h3>Edit idea</h3><p class="sub">Add details so future you knows what you meant.</p><form id="if" class="stack">'+
    '<div class="field"><label for="i-title">Idea</label><input class="input" id="i-title" required value="'+esc(i.title)+'"></div>'+
    '<div class="row"><div class="field"><label for="i-area">Area</label><select class="select" id="i-area">'+Object.keys(AREAS).map(function(k){return '<option value="'+k+'"'+((i.area||'mentoring')===k?' selected':'')+'>'+AREAS[k]+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label for="i-status">Status</label><select class="select" id="i-status">'+Object.keys(STATUS).map(function(k){return '<option value="'+k+'"'+(i.status===k?' selected':'')+'>'+STATUS[k]+'</option>';}).join('')+'</select></div></div>'+
    '<div class="field"><label for="i-notes">Notes</label><textarea class="textarea" id="i-notes" placeholder="Why it matters, how it could work">'+esc(i.notes||'')+'</textarea></div>'+
    '<div class="modal-foot"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary" type="submit">Save</button></div></form>',
  function(m){
    m.querySelector('[data-close]').onclick=closeModal;
    $('#if').onsubmit=function(e){e.preventDefault();var t=$('#i-title').value.trim();if(!t)return;put(id,Object.assign({},i,{title:t,area:$('#i-area').value,status:$('#i-status').value,notes:$('#i-notes').value.trim()}));closeModal();};
  });
}

function confirmDelete(label,fn){
  openModal('<h3>Delete '+esc(label)+'?</h3><p class="sub">This can\'t be undone.</p><div class="modal-foot"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="yes" style="background:var(--danger);border-color:var(--danger);color:#fff">Delete</button></div>',
  function(m){m.querySelector('[data-close]').onclick=closeModal;$('#yes').onclick=function(){fn();closeModal();Sound.play('remove');};});
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var tab=e.target.closest('[data-tab]');
  if(tab){if(tab.dataset.tab!==state.tab)Sound.play('nav');setState({tab:tab.dataset.tab});return;}
  var a=e.target.closest('[data-act]');if(!a)return;
  var id=a.dataset.id, act=a.dataset.act;
  switch(act){
    case 'toggle':
      var r=items[id];if(!r)return;var k=dayKey(),done=Object.assign({},r.done||{});
      if(done[k])delete done[k];else done[k]=true;
      Object.keys(done).forEach(function(d){if(d<dayKey(new Date(Date.now()-60*864e5)))delete done[d];}); // keep ~60 days
      var nowDone=!!done[k];
      put(id,Object.assign({},r,{done:done}));
      pop(document.querySelector('.check[data-id="'+id+'"]'));
      if(nowDone){var td=all('resp').filter(function(x){return occursOn(x,new Date());});
        var allDone=td.length>1&&td.every(function(x){return x.done&&x.done[k];});
        Sound.play(allDone?'trophy':'check');if(allDone)toast('Everything done for today');}
      else Sound.play('uncheck');
      break;
    case 'sound':var onNow=Sound.toggle();renderNav();toast(onNow?'Sound on':'Sound off');break;
    case 'new-resp':respModal(null);break;
    case 'edit-resp':respModal(id);break;
    case 'del-resp':confirmDelete('this responsibility',function(){remove(id);});break;
    case 'resp-filter':setState({respFilter:a.dataset.val});break;
    case 'new-tpl':
      var nid=uid('t');var cat=state.tplCat!=='All'?state.tplCat:'';
      items[nid]={kind:'template',title:'',category:cat,body:'',pinned:false,updatedAt:Date.now()};
      state.tplQuery='';put(nid,items[nid]);setState({tab:'templates',tplId:nid,tplView:'library'});
      setTimeout(function(){var t=$('#tpl-title');if(t)t.focus();},0);break;
    case 'pick-tpl':setState({tplId:id});break;
    case 'pick-tpl-lib':setState({tplId:id,tplView:'library',tplCat:'All',tplQuery:''});break;
    case 'tpl-view':Sound.play('tick');setState({tplView:a.dataset.val});break;
    case 'tpl-for':newTemplateFor(id);break;
    case 'del-sit':confirmDelete('this situation',function(){remove(id);});break;
    case 'idea-area':setState({ideaArea:a.dataset.val});break;
    case 'idea-area-filter':setState({ideaFilter:a.dataset.val});break;
    case 'use-tpl':useTemplate(id);break;
    case 'pin-tpl':Sound.play('tick');put(id,Object.assign({},items[id],{pinned:!items[id].pinned}));break;
    case 'dup-tpl':var c=Object.assign({},items[id],{title:(items[id].title||'Untitled')+' (copy)',pinned:false,updatedAt:Date.now()});var cid=uid('t');put(cid,c);setState({tplId:cid});break;
    case 'del-tpl':confirmDelete('"'+(items[id].title||'Untitled')+'"',function(){remove(id);state.tplId=null;render();});break;
    case 'tpl-cat':setState({tplCat:a.dataset.val,tplId:null});break;
    case 'idea-filter':setState({ideaFilter:a.dataset.val});break;
    case 'cycle-idea':var nx={new:'planned',planned:'done',done:'new'};var ns=nx[items[id].status]||'new';Sound.play(ns==='done'?'check':'tick');put(id,Object.assign({},items[id],{status:ns}));break;
    case 'edit-idea':ideaModal(id);break;
    case 'del-idea':confirmDelete('this idea',function(){remove(id);});break;
    case 'new-res':resModal(null);break;
    case 'edit-res':resModal(id);break;
    case 'view-res':viewNote(id);break;
    case 'copy-res':var rr=items[id];if(rr)copyText(rr.rtype==='note'?(rr.text||''):(rr.url||''));break;
    case 'pin-res':Sound.play('tick');put(id,Object.assign({},items[id],{pinned:!items[id].pinned}));break;
    case 'res-type':setState({resType:a.dataset.val});break;
    case 'res-tag':setState({resTag:state.resTag===a.dataset.val?'':a.dataset.val});break;
    case 'del-res':confirmDelete('this resource',function(){var rr2=items[id];if(rr2&&rr2.fileId&&assetsCap){assetsCap.delete(rr2.fileId).catch(function(){});}remove(id);});break;
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='tpl-q'){state.tplQuery=e.target.value;state.tplId=null;render();}
  if(e.target.id==='res-q'){state.resQuery=e.target.value;render();}
});
document.addEventListener('submit',function(e){
  if(e.target.id==='sit-form'){
    e.preventDefault();var st=$('#sit-title').value.trim();if(!st)return;
    var sc=$('#sit-cat').value.trim()||'Student support';
    put(uid('s'),{kind:'situation',title:st,category:sc,order:Date.now()});
    var f=$('#sit-title');if(f){f.value='';f.focus();}toast('Situation added');Sound.play('pop');return;
  }
  if(e.target.id==='idea-form'){
    e.preventDefault();var inp=$('#idea-title'),t=inp.value.trim();if(!t)return;
    var before=ideaStats().met;
    put(uid('i'),{kind:'idea',title:t,notes:'',status:'new',area:state.ideaArea||'mentoring',createdAt:Date.now()});
    if(!before&&ideaStats().met){toast('Weekly goal hit. Nice.');Sound.play('trophy');} else Sound.play('pop');
    var nl=document.querySelector('#main .li');if(nl&&canAnimate())gsap.from(nl,{y:-12,opacity:0,duration:.6,ease:'power3.out',clearProps:'transform,opacity'});
    var el=$('#idea-title');if(el){el.value='';el.focus();}
  }
});

/* refresh "Today" when the date changes */
var lastDay=dayKey();
setInterval(function(){if(dayKey()!==lastDay){lastDay=dayKey();render();}},60000);

loadLocal();
render();
connect();
setTimeout(intro,1400); // never stay hidden
})();
</script>
</body>
</html>
